name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release (e.g. 0.1.0, no "v" prefix). Leave blank to use
          the topmost "## [X.Y.Z]" heading in CHANGELOG.md.
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  GOWORK: "off"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Never release a state that wouldn't pass CI.
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Resolve version and notes from CHANGELOG.md
        id: changelog
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 -oP '^## \[\K[^\]]+' CHANGELOG.md || true)
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "Unreleased" ]; then
            echo "::error::No release version: pass one, or put '## [X.Y.Z]' at the top of CHANGELOG.md"
            exit 1
          fi
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag release
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          ACTOR: ${{ github.actor }}
          ACTOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_EMAIL"
          # A re-run replaces the tag instead of failing.
          git tag -d "v$VERSION" 2>/dev/null || true
          git push origin ":refs/tags/v$VERSION" 2>/dev/null || true
          git tag -a "v$VERSION" -F /tmp/release-notes.md
          git push origin "v$VERSION"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the Linux binaries, publishes the GitHub Release with
      # checksums, and pushes the multi-arch ghcr.io image.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
