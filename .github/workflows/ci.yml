name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./... && (cd test/integration && go vet ./...)
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: fuzz (short)
        run: |
          go test -run '^$' -fuzz '^FuzzVerify$' -fuzztime 30s ./internal/login
          go test -run '^$' -fuzz '^FuzzParseScope$' -fuzztime 30s ./internal/grants
          go test -run '^$' -fuzz '^FuzzTemplateIsolation$' -fuzztime 30s ./internal/grants
      - name: integration tests (Distribution v3, registry:2.8.3, registry:3.0.0, docker CLI)
        run: |
          docker pull -q registry:2.8.3 && docker pull -q registry:3.0.0
          cd test/integration && go test -race -count=1 ./...
      - name: image
        run: docker build -f deploy/Dockerfile -t registry-pass:ci .
      - name: helm
        run: helm lint deploy/helm/registry-pass
      - name: release dry run (all Linux binaries)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean
