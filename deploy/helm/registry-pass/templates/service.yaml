apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-registry-pass
  labels:
    app.kubernetes.io/name: registry-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: registry-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
    - {name: admin, port: {{ .Values.service.adminPort }}, targetPort: admin}
