{{- $tag := default .Chart.AppVersion .Values.image.tag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-registry-pass
  labels:
    app.kubernetes.io/name: registry-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-pass
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-pass
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: registry-pass
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ $tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/registry-pass/config.yaml", "serve"]
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - {name: http, containerPort: {{ .Values.service.port }}}
            - {name: admin, containerPort: {{ .Values.service.adminPort }}}
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/registry-pass, readOnly: true}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-registry-pass}
        - name: secrets
          secret: {secretName: {{ .Values.secretName }}, defaultMode: 0400}
