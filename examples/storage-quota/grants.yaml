# Members push to their own namespace and delete there, so a member whose
# namespace is full can free space; anyone pulls.
templates:
  - {repos: "{name}/**", actions: [pull, push, delete]}
anonymous:
  - {repos: "**", actions: [pull]}
reservedNames: [library, verified, admin]
